name: Build STAFFJOBS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: gradle build

      - name: Read plugin version
        id: meta
        run: echo "version=$(grep '^version =' build.gradle | sed -E \"s/version = ['\\\"]([^'\\\"]+)['\\\"]/\\1/\")" >> "$GITHUB_OUTPUT"

      - name: Upload STAFFJOBS JAR
        uses: actions/upload-artifact@v4
        with:
          name: StaffJobs${{ steps.meta.outputs.version }}
          path: build/libs/*.jar
