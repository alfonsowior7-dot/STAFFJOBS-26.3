name: Build STAFFJOBS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: gradle build

      - name: Read plugin version
        id: meta
        run: VERSION=$(awk -F "'" '/^version =/ {print $2}' build.gradle); echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload STAFFJOBS JAR
        uses: actions/upload-artifact@v4
        with:
          name: StaffJobs${{ steps.meta.outputs.version }}-26.3
          path: build/libs/*.jar
